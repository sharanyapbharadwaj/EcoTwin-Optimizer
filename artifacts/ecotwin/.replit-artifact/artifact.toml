kind = "web"
previewPath = "/"
title = "EcoTwin"
description = "A responsive sustainable-energy monitoring and optimization platform with a shared dashboard and four interactive digital-twin simulations for cold storage, solar generation, data-center scheduling, and home energy reuse."
version = "1.0.0"
id = "artifacts/ecotwin"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23171

[services.development]
run = "pnpm --filter @workspace/ecotwin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ecotwin", "run", "build" ]
serve = "static"
publicDir = "artifacts/ecotwin/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23171"
BASE_PATH = "/"
